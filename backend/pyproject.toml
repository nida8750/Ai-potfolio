[project]
name = "nida-ai-backend"
version = "0.1.0"
description = "FastAPI backend for the Nida AI portfolio platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "supabase>=2.10.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends()/File() defaults are idiomatic.
"app/api/**/*.py" = ["B008"]
"tests/**/*.py" = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "app.services.conversation_service",
    "app.services.automation_service",
    "app.services.rag_service",
    "app.services.dashboard_service",
    "app.services.auth_service",
]
# Supabase client returns loosely typed JSON unions; cast noise is not actionable.
disable_error_code = [
    "return-value",
    "arg-type",
    "union-attr",
    "index",
    "dict-item",
    "call-overload",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
