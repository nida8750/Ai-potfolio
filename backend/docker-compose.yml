# Backend-only compose. Prefer the repo-root docker-compose.yml for the full stack.
# Secrets stay in .env — never commit real credentials.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nida-ai-backend:local
    container_name: nida-ai-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:43127}
    volumes:
      - backend_data:/app/.data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  backend_data:
