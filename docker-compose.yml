# FastAPI backend + Next.js frontend.
# Secrets stay in env files — never commit real credentials.
#
#   docker compose up --build -d
#   curl http://127.0.0.1:8000/health
#   curl http://127.0.0.1:43127/api/health

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nida-ai-backend:local
    container_name: nida-ai-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:43127}
    volumes:
      - backend_data:/app/.data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:43127}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://127.0.0.1:8000}
    image: nida-ai-frontend:local
    container_name: nida-ai-frontend
    ports:
      - "${FRONTEND_PORT:-43127}:43127"
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:43127}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://127.0.0.1:8000}
      PORT: "43127"
      HOSTNAME: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_data:/app/.data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:43127/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  backend_data:
  frontend_data:
